name: Lab5 Typebot self-hosted verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lab5-check.yml'
      - 'lab5/check.cjs'
permissions:
  contents: write
concurrency:
  group: lab5-runtime
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable Typebot
        run: |
          mkdir -p lab5/evidence lab5/screenshots
          umask 077
          { echo "ENCRYPTION_SECRET=$(openssl rand -hex 16)"; echo "WEBHOOK_RELAY_SECRET=$(openssl rand -hex 32)"; echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"; echo "ADMIN_EMAIL=lab5@example.com"; } >lab5/.env
          docker compose -f lab5/compose.yaml up -d
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/signin >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8080/signin >/dev/null
      - name: Install browser
        run: |
          npm install --prefix /tmp/lab5-browser playwright
          /tmp/lab5-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Import and test actual Typebot
        run: NODE_PATH=/tmp/lab5-browser/node_modules node lab5/check.cjs
      - name: Save container status
        if: always()
        run: |
          mkdir -p lab5/evidence
          docker compose -f lab5/compose.yaml ps >lab5/evidence/docker-ps.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab5-runtime-evidence
          path: |
            lab5/evidence
            lab5/screenshots
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab5/evidence lab5/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Lab5: record actual Typebot test evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
