name: Lab 2 - Docker runtime check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lab2-check.yml'
      - 'lab2/check-runtime.cjs'
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Node-RED and install required nodes
        run: |
          mkdir -p lab2/data lab2/evidence
          node -e 'const fs=require("fs");const a=fs.readdirSync("lab2/flows").filter(x=>x.endsWith(".json")).sort().flatMap(x=>JSON.parse(fs.readFileSync("lab2/flows/"+x)));for(const n of a)if(n.type==="debug")n.console=true;fs.writeFileSync("lab2/data/flows.json",JSON.stringify(a))'
          sudo chown -R 1000:1000 lab2/data
          docker pull nodered/node-red:latest
          docker run --rm -v "$PWD/lab2/data:/data" --entrypoint npm nodered/node-red:latest install --prefix /data node-red-dashboard node-red-contrib-telegrambot
          docker compose -f lab2/compose.yaml up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:1880/ >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:1880/ >/dev/null
          docker exec smirnov-node-red node -v | tee lab2/evidence/node-version.txt
          docker ps --filter name=smirnov-node-red | tee lab2/evidence/docker-ps.txt
          docker logs smirnov-node-red 2>&1 | tee lab2/evidence/startup.log
      - name: Browser screenshots and endpoint checks
        run: |
          npm install --prefix /tmp/lab2-browser playwright
          /tmp/lab2-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/lab2-browser/node_modules node lab2/check-runtime.cjs
      - name: Verify persistence across container restart
        run: |
          set -euo pipefail
          {
            echo "POST write inject"
            curl -fsS -X POST http://localhost:1880/inject/l2-11-write
            for i in $(seq 1 20); do
              if docker exec smirnov-node-red test -s /data/smirnov-lab2.json; then break; fi
              sleep 1
            done
            sleep 2
            docker exec smirnov-node-red cat /data/smirnov-lab2.json > /tmp/lab2-before.json
            echo "Before restart:"
            cat /tmp/lab2-before.json
            node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/lab2-before.json"));if(a.student!=="Smirnov"||!a.timestamp)process.exit(1)'
            docker compose -f lab2/compose.yaml restart
            for i in $(seq 1 60); do curl -fsS http://localhost:1880/ >/dev/null && break; sleep 2; done
            curl -fsS http://localhost:1880/ >/dev/null
            docker exec smirnov-node-red cat /data/smirnov-lab2.json > /tmp/lab2-after.json
            echo "After restart:"
            cat /tmp/lab2-after.json
            cmp /tmp/lab2-before.json /tmp/lab2-after.json
            echo "PASS: file content identical after restart"
            curl -fsS -X POST http://localhost:1880/inject/l2-11-read
            sleep 2
            echo "PASS: read inject accepted"
          } 2>&1 | tee lab2/evidence/persistence.txt
          NODE_PATH=/tmp/lab2-browser/node_modules node lab2/check-persistence.cjs
      - name: Capture runtime logs
        if: always()
        run: |
          mkdir -p lab2/evidence
          docker logs smirnov-node-red >lab2/evidence/runtime.log 2>&1 || true
      - name: Copy screenshots to required folder
        if: always()
        run: |
          mkdir -p lab2/screenshots
          for f in lab2/evidence/editor-*.png; do
            [ -f "$f" ] || continue
            cp "$f" "lab2/screenshots/$(basename "$f" | sed 's/^editor-//')"
          done
          for f in lab2/evidence/00-versions.png lab2/evidence/api-*.png lab2/evidence/dashboard.png lab2/evidence/file-after-restart.png; do
            [ ! -f "$f" ] || cp "$f" lab2/screenshots/
          done
      - name: Upload genuine test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-runtime-evidence
          path: lab2/evidence/
      - name: Save evidence to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab2/evidence/ lab2/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Record lab2 Docker runtime evidence"
            git push origin HEAD:main
          fi
